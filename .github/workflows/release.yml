# Builds the Windows installer and portable exe and publishes them as a GitHub Release.
# Runs when a version tag is pushed (v3.0.0, v3.1.0…). The tag must match "version" in
# package.json, so the file names and the release name agree.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the files

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # electron-builder downloads its own copy of Electron
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run dist # typecheck, unit tests, then the installer and portable exe

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Cram-*-setup.exe dist/Cram-*-portable.exe \
            --title "Cram ${GITHUB_REF_NAME#v}" \
            --generate-notes
